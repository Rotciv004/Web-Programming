<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vertical Menu</title>
  <style>
    #vertical-menu {
      width: 200px;
      font-family: Arial, sans-serif;
    }

    #vertical-menu ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    #vertical-menu li {
      border: 1px solid #ccc;
      margin-bottom: 1px;
      background-color: #f9f9f9;
      padding: 8px;
      position: relative;
    }

    #vertical-menu li ul {
      display: none;
      background-color: #e9e9e9;
      margin-top: 5px;
    }

    #vertical-menu li ul li {
      border: none;
      padding: 6px;
      cursor: pointer;
    }
    
    #vertical-menu li:hover {
      background-color: #ddd;
    }
  </style>
</head>

<header>
  <h1>This is the menu</h1>
</header>



<body>

  <div id="vertical-menu"></div>
  

  <script>
    var menuData = [
      { title: "Menu 1", items: ["Item 1.1", "Item 1.2", "Item 1.3"] },
      { title: "Menu 2", items: ["Item 2.1", "Item 2.2", "Item 2.3", "Item 2.4"] },
      { title: "Menu 3", items: ["Item 3.1", "Item 3.2", "Item 3.3", "Item 3.4", "Item 3.5"] },
      { title: "Menu 4", items: ["Item 4.1", "Item 4.2", "Item 4.3"] },
      { title: "Menu 5", items: ["Item 5.1", "Item 5.2", "Item 5.3", "Item 5.4"] }
    ];



    function createVerticalMenu(menuData) 
    {
      var menuContainer = document.getElementById("vertical-menu");
      var mainList = document.createElement("ul");

      menuData.forEach
      (function(menu) 
      {
        var listItem = document.createElement("li");
        listItem.textContent = menu.title;
        
        var subList = document.createElement("ul");

        menu.items.forEach
        (function(subItem) 
        {
          var subListItem = document.createElement("li");
          subListItem.textContent = subItem;

          subList.appendChild(subListItem);
        }
        );

        listItem.appendChild(subList);
        
        listItem.addEventListener
        ("click", function(event) 
        {
          
          event.stopPropagation();
        
          if (subList.style.display === "block") 
            {subList.style.display = "none";
              window.alert(menu.title);
            }
          else 
            subList.style.display = "block";
          
        }
        );

        mainList.appendChild(listItem);
      }
      );

      menuContainer.appendChild(mainList);
    }

    createVerticalMenu(menuData);

  </script>
</body>

<footer>
  <h2>This was the menu</h2>
</footer>

</html>

<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <title>3D Cube Explosion</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f0f0;
            perspective: 800px;
        }

        /* Cub p-zis */
        .cube {
            position: relative;
            width: 100px;
            height: 100px;
            transform-style: preserve-3d;
            transform: rotateX(-30deg) rotateY(45deg);
            cursor: pointer;
        }

        /* Comenzi fete */
        .cube div {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(0, 128, 255, 0.8);
            border: 2px solid #fff;
        }

        /* Poozitei fete */
        .cube .front {
            transform: translateZ(50px);
        }

        .cube .back {
            transform: rotateY(180deg) translateZ(50px);
        }

        .cube .right {
            transform: rotateY(90deg) translateZ(50px);
        }

        .cube .left {
            transform: rotateY(-90deg) translateZ(50px);
        }

        .cube .top {
            transform: rotateX(90deg) translateZ(50px);
        }

        .cube .bottom {
            transform: rotateX(-90deg) translateZ(50px);
        }

        /* Animatie explozie */
        .cube.explode .front {
            animation: explodeFront 1s forwards;
        }

        @keyframes explodeFront {
            0% {
                transform: translateZ(50px);
            }

            100% {
                transform: translateZ(150px) scale(1.2);
            }
        }

        .cube.explode .back {
            animation: explodeBack 1s forwards;
        }

        @keyframes explodeBack {
            0% {
                transform: rotateY(180deg) translateZ(50px);
            }

            100% {
                transform: rotateY(180deg) translateZ(150px) scale(1.2);
            }
        }

        .cube.explode .right {
            animation: explodeRight 1s forwards;
        }

        @keyframes explodeRight {
            0% {
                transform: rotateY(90deg) translateZ(50px);
            }

            100% {
                transform: rotateY(90deg) translateZ(150px) scale(1.2);
            }
        }

        .cube.explode .left {
            animation: explodeLeft 1s forwards;
        }

        @keyframes explodeLeft {
            0% {
                transform: rotateY(-90deg) translateZ(50px);
            }

            100% {
                transform: rotateY(-90deg) translateZ(150px) scale(1.2);
            }
        }

        .cube.explode .top {
            animation: explodeTop 1s forwards;
        }

        @keyframes explodeTop {
            0% {
                transform: rotateX(90deg) translateZ(50px);
            }

            100% {
                transform: rotateX(90deg) translateZ(150px) scale(1.2);
            }
        }

        .cube.explode .bottom {
            animation: explodeBottom 1s forwards;
        }

        @keyframes explodeBottom {
            0% {
                transform: rotateX(-90deg) translateZ(50px);
            }

            100% {
                transform: rotateX(-90deg) translateZ(150px) scale(1.2);
            }
        }
    </style>
</head>

<body>
    <!-- Cubul este compus din 6 div-uri ce reprezintă fețele -->
    <div class="cube" id="cube">
        <div class="front"></div>
        <div class="back"></div>
        <div class="right"></div>
        <div class="left"></div>
        <div class="top"></div>
        <div class="bottom"></div>
    </div>

    <script>
        // La click, se adaugă/elimină clasa "explode" pentru a declanșa animațiile
        const cube = document.getElementById('cube');
        cube.addEventListener('click', function () {
            cube.classList.toggle('explode');
        });
    </script>
</body>

</html>

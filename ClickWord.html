<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Highlight Word on Double-Click</title>
  <style>
    .highlight {
      background-color: blueviolet;  
    }

    .highlight_undo {
      background-color: white;
    }
  </style>
  
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script>

    $(document).ready(function() {

      $("p").dblclick(function() {

        var selectedWord = window.getSelection().toString().trim();

        if (selectedWord.length > 0) {

          var regex = new RegExp("\\b" + selectedWord + "\\b", "g");

          $("p").each(function() {

            var originalContent = $(this).html();

            if (originalContent.includes('<span class="highlight">' + selectedWord + '</span>')) 
            {
              var modifiedContent = originalContent.replace(regex,'<span class="highlight_undo">' + selectedWord + '</span>');
            } 
            else 
            {
              var modifiedContent = originalContent.replace(regex,'<span class="highlight">' + selectedWord + '</span>');
            }

            $(this).html(modifiedContent);

          });
        }
      });
    });

  </script>
  
</head>
<body>

  <h2>Double-Click Word Highlight Example</h2>

  <p>
    Hello, this is a sample paragraph.
  </p>

  <p>
    Hello, this is another sample paragraph.
  </p>

</body>
</html>
